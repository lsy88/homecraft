server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    etag on;

    # dist/ holds .gz copies of every text file; gzip stays on as a fallback.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json application/xml image/svg+xml;

    sendfile on;
    tcp_nopush on;

    # Mixing a fresh ES module with a cached one stops startup, so nothing is
    # cached (docs/deploy.md). add_header is NOT inherited by any location
    # that sets its own add_header, so every such location must include the
    # security headers snippet itself and repeat its Cache-Control policy.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;

    # Other Homecraft sites read this file cross-origin (docs/site-metadata.md).
    location = /homecraft.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build output. Long cache is safe only if every file under
    # /assets/ carries a content hash in its filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        # Directory requests without index.html return 404 instead of 403.
        # The // produced for "/" is normalized by the filesystem, so this is
        # fine; it only looks odd in debug logs.
        try_files $uri $uri/index.html =404;
    }
}